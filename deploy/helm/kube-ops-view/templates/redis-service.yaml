{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-ops-view.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-ops-view.redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
  - name: redis
    port: 6379
    targetPort: redis
    protocol: TCP
  selector:
    {{- include "kube-ops-view.redis.selectorLabels" . | nindent 4 }}
{{- end }}