{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kube-ops-view.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-ops-view.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kube-ops-view.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from any pod in the cluster (for web access)
  - from: []
    ports:
    - protocol: TCP
      port: {{ .Values.config.server.port }}
  egress:
  # Allow egress to Kubernetes API server
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443
  {{- if .Values.redis.enabled }}
  # Allow egress to Redis
  - to:
    - podSelector:
        matchLabels:
          {{- include "kube-ops-view.redis.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: 6379
  {{- end }}
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

{{- if .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kube-ops-view.fullname" . }}-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kube-ops-view.redis.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "kube-ops-view.redis.selectorLabels" . | nindent 6 }}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress only from kube-ops-view frontend
  - from:
    - podSelector:
        matchLabels:
          {{- include "kube-ops-view.selectorLabels" . | nindent 10 }}
    ports:
    - protocol: TCP
      port: 6379
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
{{- end }}
{{- end }}