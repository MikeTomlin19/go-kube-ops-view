apiVersion: v1
kind: Secret
metadata:
  name: kube-ops-view-secret
  namespace: kube-ops-view
  labels:
    app.kubernetes.io/name: kube-ops-view
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: kube-ops-view
type: Opaque
data:
  # Base64 encoded secret key - CHANGE THIS IN PRODUCTION
  # This is "change-me-in-production" base64 encoded
  secret-key: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=

---
# OAuth credentials secret (optional - create only if using OAuth)
apiVersion: v1
kind: Secret
metadata:
  name: kube-ops-view-oauth
  namespace: kube-ops-view
  labels:
    app.kubernetes.io/name: kube-ops-view
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: kube-ops-view
type: Opaque
data:
  # Base64 encoded OAuth client secret - SET THIS IN PRODUCTION
  # client-secret: <base64-encoded-oauth-client-secret>

---
# Redis password secret (optional - create only if Redis requires authentication)
apiVersion: v1
kind: Secret
metadata:
  name: kube-ops-view-redis
  namespace: kube-ops-view
  labels:
    app.kubernetes.io/name: kube-ops-view
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: kube-ops-view
type: Opaque
data:
  # Base64 encoded Redis password - SET THIS IN PRODUCTION
  # password: <base64-encoded-redis-password>

---
# External cluster kubeconfig secret (optional - create only if accessing external clusters)
apiVersion: v1
kind: Secret
metadata:
  name: kube-ops-view-kubeconfig
  namespace: kube-ops-view
  labels:
    app.kubernetes.io/name: kube-ops-view
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: kube-ops-view
type: Opaque
data:
  # Base64 encoded kubeconfig file - SET THIS IN PRODUCTION
  # config: <base64-encoded-kubeconfig-file>