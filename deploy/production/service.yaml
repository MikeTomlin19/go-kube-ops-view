apiVersion: v1
kind: Service
metadata:
  name: kube-ops-view
  namespace: kube-ops-view
  labels:
    app.kubernetes.io/name: kube-ops-view
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: kube-ops-view
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: kube-ops-view
    app.kubernetes.io/component: frontend

---
# Optional: Headless service for StatefulSet-like behavior or service discovery
apiVersion: v1
kind: Service
metadata:
  name: kube-ops-view-headless
  namespace: kube-ops-view
  labels:
    app.kubernetes.io/name: kube-ops-view
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: kube-ops-view
spec:
  type: ClusterIP
  clusterIP: None
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: kube-ops-view
    app.kubernetes.io/component: frontend