# Development overrides for docker-compose.yml
# This file is automatically loaded by docker-compose and provides
# development-specific configurations

services:
  kube-ops-view:
    # Mount source code for live development (if needed)
    volumes:
      - ${HOME}/.kube:/home/appuser/.kube:ro
      - ${PWD}/config:/app/config:ro
      # Uncomment for live development (requires proper file watching setup)
      # - ${PWD}:/src:ro
    environment:
      # Development-specific environment variables
      - DEBUG=true
      - LOG_LEVEL=debug
      - LOG_FORMAT=text
      - MOCK=true  # Use mock data for development
    # Enable all profiles for development
    profiles: []

  redis:
    # Development Redis configuration
    command: redis-server --appendonly yes --loglevel verbose

  # Enable Redis Commander by default in development
  redis-commander:
    profiles: []
